# Builds the demo site and publishes it to GitHub Pages:
# https://coolhackboy.github.io/open-free-tools/
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `vite build` also prerenders every tool page (dist/tools/<slug>/index.html, dist/zh/...),
      # sitemap.xml, robots.txt and 404.html; see scripts/prerender.ts.
      - run: npm run build -- --base=/open-free-tools/
        env:
          VITE_SITE_URL: https://coolhackboy.github.io/open-free-tools
      - name: Check the prerendered output
        run: |
          test -f dist/tools/qr-code-generator/index.html
          test -f dist/zh/tools/qr-code-generator/index.html
          test -f dist/sitemap.xml
          test -f dist/404.html
          echo "pages: $(find dist -name index.html | wc -l)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
